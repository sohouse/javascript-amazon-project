<!DOCTYPE html>
<html>
<head>
  <title>Money.js Test Suite</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .test-result {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
    }
    .pass {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .fail {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .test-summary {
      font-weight: bold;
      margin-top: 20px;
      padding: 10px;
      border-top: 2px solid #000;
    }
  </style>
</head>
<body>
  <h1>Money.js Test Results</h1>
  <div id="test-results"></div>

  <script type="module">
    import { fixedAmount } from './script/util/money.js';

    // Test results array
    let testResults = [];
    
    // Simple test framework
    function assertEquals(actual, expected, testName) {
      const passed = actual === expected;
      testResults.push({
        name: testName,
        passed: passed,
        expected: expected,
        actual: actual
      });
      
      const resultDiv = document.createElement('div');
      resultDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
      resultDiv.innerHTML = `
        <strong>${passed ? 'PASS' : 'FAIL'}:</strong> ${testName} 
        ${passed ? '' : `<br>Expected: ${expected}, but got: ${actual}`}
      `;
      document.getElementById('test-results').appendChild(resultDiv);
    }

    function runTests() {
      // Clear previous results
      testResults = [];
      document.getElementById('test-results').innerHTML = '';
      
      // Test case 1: Basic functionality with 2 decimal places
      const result1 = fixedAmount(1500, 2);
      assertEquals(result1, '15.00', 'fixedAmount(1500, 2) should return "15.00"');

      // Test case 2: With 1 decimal place
      const result2 = fixedAmount(1234, 1);
      assertEquals(result2, '12.3', 'fixedAmount(1234, 1) should return "12.3"');

      // Test case 3: With 0 decimal places
      const result3 = fixedAmount(5000, 0);
      assertEquals(result3, '50', 'fixedAmount(5000, 0) should return "50"');

      // Test case 4: Amount less than a dollar
      const result4 = fixedAmount(50, 2);
      assertEquals(result4, '0.50', 'fixedAmount(50, 2) should return "0.50"');

      // Test case 5: Amount with rounding
      const result5 = fixedAmount(999, 2);
      assertEquals(result5, '9.99', 'fixedAmount(9999, 2) should return "9.99"');

      // Test case 5: Amount with rounding
      const result6 = fixedAmount(2000.4, 2);
      assertEquals(result6, '20.00', 'fixedAmount(2000.4, 2) should return "20.00"');
      
      // Display summary
      const passedTests = testResults.filter(t => t.passed).length;
      const totalTests = testResults.length;
      
      const summaryDiv = document.createElement('div');
      summaryDiv.className = 'test-summary';
      summaryDiv.innerHTML = `Tests completed: ${passedTests}/${totalTests} passed`;
      document.getElementById('test-results').appendChild(summaryDiv);
    }

    // Run tests when page loads
    runTests();
  </script>
</body>
</html>
